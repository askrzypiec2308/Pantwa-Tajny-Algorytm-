<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <!-- Poniższe linijki sprawiają, że strona zachowuje się na telefonie jak aplikacja -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gra w Państwa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --grid-line: rgba(255, 255, 255, 0.14);
            --grid-cell: 60px;
            --space-a: #1b1035;
            --space-b: #0a0e27;
            --space-c: #0d1b2a;
            --glow-1: #2c9abf47;
            --glow-2: rgba(76, 133, 240, 0.22);
            --font-display: 'Press Start 2P', monospace;
            --font-country: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { background-color: var(--bg); color: white; overflow: hidden; height: 100%; }
        body { font-family: var(--font-country); }

        /* Siatka w tle - widoczna na wszystkich ekranach, tak jak na moodboardzie */
        .grid-overlay {
            position: fixed; inset: 0; z-index: 50; pointer-events: none;
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: var(--grid-cell) var(--grid-cell);
        }

        .screen {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            display: none;
        }
        .screen.active { display: flex; }

        /* ---------- EKRAN STARTOWY ---------- */
        #screen-start {
            flex-direction: column; align-items: flex-start; justify-content: flex-start;
            padding: calc(var(--grid-cell) * 1.1) 0 0 calc(var(--grid-cell) * 0.5);
            background-color: var(--bg);
        }
        #screen-start h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 8vw, 2.6rem);
            line-height: 1.55;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #start-earth-wrap {
            flex: 1; width: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        #start-earth {
            position: relative; z-index: 100;
            width: 46%; max-width: 242px; height: auto;
            image-rendering: pixelated;
        }
        .start-btn-wrap {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: calc(var(--grid-cell) * 1.4);
        }
        .pixel-pill {
            font-family: var(--font-display);
            font-size: clamp(1rem, 5vw, 1.5rem);
            letter-spacing: 2px;
            color: white;
            background: transparent;
            border: 3px solid white;
            border-radius: 60px;
            padding: 18px 48px;
            cursor: pointer;
        }
        .pixel-pill:active { background: white; color: black; }

        /* ---------- EKRAN WYBORU TRYBU ---------- */
        #screen-mode {
            flex-direction: column; align-items: flex-start; justify-content: flex-start;
            padding: calc(var(--grid-cell) * 1.1) calc(var(--grid-cell) * 0.5) calc(var(--grid-cell) * 0.6);
            background-color: var(--bg);
        }
        #screen-mode h1 {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 7.5vw, 2.3rem);
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: calc(var(--grid-cell) * 0.6);
        }
        .mode-list {
            flex: 1; width: 100%;
            display: flex; flex-direction: column; justify-content: center;
            gap: 16px;
            padding-right: calc(var(--grid-cell) * 0.5);
            padding-bottom: calc(var(--grid-cell) * 1.2);
        }
        .mode-btn {
            width: 100%;
            display: flex; flex-direction: column; align-items: flex-start;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            padding: 16px 18px;
            cursor: pointer;
            text-align: left;
        }
        .mode-btn:active {
            border-color: #4dd8ff;
            background: rgba(77, 216, 255, 0.1);
        }
        .mode-name {
            font-family: var(--font-display);
            font-size: clamp(0.85rem, 3.8vw, 1.05rem);
            letter-spacing: 1px;
            color: white;
        }
        .mode-detail {
            font-family: var(--font-country);
            font-size: clamp(1rem, 4.4vw, 1.2rem);
            color: #9aa0b4;
            line-height: 1.2;
        }

        /* ---------- EKRAN PRZEJŚCIOWY (RUNDA / KONTYNENT) ---------- */
        #screen-interstitial {
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
            background: linear-gradient(135deg, var(--space-a), var(--space-b) 60%, var(--space-c));
        }
        #interstitial-earth {
            position: relative; z-index: 100;
            width: 90px; height: auto; image-rendering: pixelated;
            margin-bottom: 26px;
        }
        .interstitial-label {
            font-family: var(--font-display);
            font-size: 0.6rem; letter-spacing: 2px;
            color: #8892b0; margin-bottom: 16px;
        }
        #interstitial-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 11vw, 3.4rem);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        #interstitial-desc {
            font-family: var(--font-country);
            font-size: clamp(1.15rem, 5.2vw, 1.4rem);
            color: #cfd3e6;
            max-width: 320px;
            line-height: 1.35;
            margin-bottom: 40px;
        }

        /* ---------- EKRAN GRY ---------- */
        #screen-game {
            flex-direction: column; position: relative;
            background: linear-gradient(to bottom, var(--space-a) 0%, var(--space-b) 55%, var(--space-c) 100%);
        }
        @media (min-width: 768px) {
            #screen-game {
                flex-direction: row;
                background: linear-gradient(to right, var(--space-a) 0%, var(--space-b) 55%, var(--space-c) 100%);
            }
        }

        .choice-btn {
            flex: 1; border: none; cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center;
            padding: 10% 8%;
            background: transparent;
            transition: background 0.2s ease;
        }
        #btn-1 { background: radial-gradient(circle at 50% 35%, var(--glow-1), transparent 70%); }
        #btn-2 { background: radial-gradient(circle at 50% 65%, var(--glow-2), transparent 70%); }
        @media (min-width: 768px) {
            #btn-1 { background: radial-gradient(circle at 35% 50%, var(--glow-1), transparent 70%); }
            #btn-2 { background: radial-gradient(circle at 65% 50%, var(--glow-2), transparent 70%); }
        }
        .choice-btn:active { filter: brightness(1.3); }
        .choice-btn span {
            font-family: var(--font-country);
            font-weight: 400;
            font-size: clamp(2.1rem, 9vw, 3.6rem);
            letter-spacing: 0.5px;
            color: white;
            text-align: center;
            line-height: 1.1;
        }

        #game-earth {
            position: absolute; top: 50%; left: 50%;
            width: 97px; height: auto;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            z-index: 100; pointer-events: none;
        }
        @media (min-width: 768px) { #game-earth { width: 121px; } }

        #round-counter {
            position: absolute; top: calc(var(--grid-cell) * 0.4); left: 50%; transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 0.7rem; letter-spacing: 2px;
            color: rgba(255,255,255,0.85);
            z-index: 6; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            text-align: center; white-space: nowrap;
        }

        /* ---------- EKRAN WYNIKU ---------- */
        #screen-result {
            flex-direction: column; align-items: center;
            padding-top: calc(var(--grid-cell) * 1.9);
            background-color: var(--bg);
            text-align: center;
            position: relative;
        }
        #screen-result h2 {
            font-family: var(--font-display);
            font-size: clamp(0.8rem, 3.4vw, 1rem);
            color: #a8a8a8;
            letter-spacing: 1px;
            margin-bottom: 26px;
            padding: 0 20px;
        }
        .result-place {
            display: flex; flex-direction: column; align-items: center;
            padding: 0 16px;
        }
        .place-label {
            font-family: var(--font-display);
            color: #7f7f7f;
            letter-spacing: 1px;
        }
        .place-country {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .place-1 { margin-bottom: 20px; }
        .place-1 .place-label { font-size: 0.6rem; margin-bottom: 8px; }
        .place-1 .place-country { font-size: clamp(1.5rem, 7.5vw, 2.4rem); color: #ffd166; }
        .place-2 { margin-bottom: 14px; }
        .place-2 .place-label { font-size: 0.55rem; margin-bottom: 6px; }
        .place-2 .place-country { font-size: clamp(1.1rem, 5.5vw, 1.6rem); color: #d9d9d9; }
        .place-3 { margin-bottom: 14px; }
        .place-3 .place-label { font-size: 0.5rem; margin-bottom: 6px; }
        .place-3 .place-country { font-size: clamp(0.95rem, 4.6vw, 1.3rem); color: #b08d57; }

        #result-earth-wrap {
            position: absolute; bottom: -22%; left: 50%; transform: translateX(-50%);
            width: 130%; max-width: 620px;
            display: flex; justify-content: center;
            pointer-events: none;
        }
        #result-earth { position: relative; z-index: 100; width: 86%; height: auto; image-rendering: pixelated; }

        #restart-btn { position: relative; z-index: 2; margin-top: 6px; }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <!-- Ekran startowy -->
    <div id="screen-start" class="screen active">
        <h1>Wybierz<br>kraj</h1>
        <div id="start-earth-wrap">
            <img src="Ziemia.gif" id="start-earth" alt="Obracająca się Ziemia">
        </div>
        <div class="start-btn-wrap">
            <button class="pixel-pill" onclick="showScreen(screenMode)">Start</button>
        </div>
    </div>

    <!-- Ekran wyboru trybu -->
    <div id="screen-mode" class="screen">
        <h1>Wybierz<br>tryb</h1>
        <div class="mode-list">
            <button class="mode-btn" onclick="selectMode('short')">
                <span class="mode-name">Krótki</span>
                <span class="mode-detail">12 rund</span>
            </button>
            <button class="mode-btn" onclick="selectMode('medium')">
                <span class="mode-name">Średni</span>
                <span class="mode-detail">24 rundy</span>
            </button>
            <button class="mode-btn" onclick="selectMode('long')">
                <span class="mode-name">Długi</span>
                <span class="mode-detail">36 rund</span>
            </button>
            <button class="mode-btn" onclick="selectMode('ultimate')">
                <span class="mode-name">Ultimate</span>
                <span class="mode-detail">Wszystkie kraje i terytoria, kontynent po kontynencie</span>
            </button>
        </div>
    </div>

    <!-- Ekran przejściowy między rundami / kontynentami -->
    <div id="screen-interstitial" class="screen">
        <img src="Ziemia.gif" id="interstitial-earth" alt="">
        <span class="interstitial-label" id="interstitial-label"></span>
        <h1 id="interstitial-title"></h1>
        <p id="interstitial-desc"></p>
        <button class="pixel-pill" onclick="continueFromInterstitial()">Dalej</button>
    </div>

    <!-- Ekran gry -->
    <div id="screen-game" class="screen">
        <div id="round-counter"></div>
        <button id="btn-1" class="choice-btn" onclick="choose(1)"><span></span></button>
        <img src="Ziemia.gif" id="game-earth" alt="">
        <button id="btn-2" class="choice-btn" onclick="choose(2)"><span></span></button>
    </div>

    <!-- Ekran finałowy -->
    <div id="screen-result" class="screen">
        <h2>Twoje wymarzone państwa to</h2>

        <div class="result-place place-1">
            <span class="place-label">1 miejsce</span>
            <span class="place-country" id="result-place-1"></span>
        </div>
        <div class="result-place place-2">
            <span class="place-label">2 miejsce</span>
            <span class="place-country" id="result-place-2"></span>
        </div>
        <div class="result-place place-3">
            <span class="place-label">3 miejsce</span>
            <span class="place-country" id="result-place-3"></span>
        </div>

        <div id="result-earth-wrap">
            <img src="Ziemia.gif" id="result-earth" alt="Obracająca się Ziemia">
        </div>
        <button id="restart-btn" class="pixel-pill" onclick="backToModeSelect()">Zagraj od nowa</button>
    </div>

    <script>
        // ============================================================
        // TRYBY GRY
        // ============================================================
        // short/medium/long: N pojedynczych wyborów z całej puli państw i
        // terytoriów, bez powtórek (każde państwo pojawia się maks. raz
        // w rundzie 1). ultimate: idziemy kontynent po kontynencie -
        // każdy kontynent to osobna "podrunda" bez powtórek wewnątrz siebie.
        const MODE_ROUNDS = { short: 12, medium: 24, long: 36 };

        // ============================================================
        // BAZA PAŃSTW I TERYTORIÓW, POGRUPOWANA KONTYNENTAMI
        // ============================================================
        const EUROPE = [
            "Polska", "Niemcy", "Francja", "Hiszpania", "Włochy", "Portugalia",
            "Wielka Brytania", "Irlandia", "Holandia", "Belgia", "Luksemburg",
            "Szwajcaria", "Austria", "Czechy", "Słowacja", "Węgry", "Słowenia",
            "Chorwacja", "Bośnia i Hercegowina", "Serbia", "Czarnogóra",
            "Macedonia Północna", "Albania", "Kosowo", "Grecja", "Bułgaria",
            "Rumunia", "Mołdawia", "Ukraina", "Białoruś", "Litwa", "Łotwa",
            "Estonia", "Rosja", "Finlandia", "Szwecja", "Norwegia", "Dania",
            "Islandia", "Malta", "Cypr", "San Marino", "Monako", "Liechtenstein",
            "Andora", "Watykan", "Wyspa Man", "Guernsey", "Jersey", "Gibraltar",
            "Wyspy Owcze", "Akrotiri i Dhekelia"
        ];

        const ASIA = [
            "Chiny", "Japonia", "Korea Południowa", "Korea Północna", "Mongolia",
            "Indie", "Pakistan", "Bangladesz", "Sri Lanka", "Nepal", "Bhutan",
            "Malediwy", "Afganistan", "Iran", "Irak", "Arabia Saudyjska", "Jemen",
            "Oman", "Zjednoczone Emiraty Arabskie", "Katar", "Bahrajn", "Kuwejt",
            "Jordania", "Liban", "Syria", "Izrael", "Palestyna", "Turcja",
            "Kazachstan", "Uzbekistan", "Turkmenistan", "Tadżykistan", "Kirgistan",
            "Azerbejdżan", "Armenia", "Gruzja", "Tajwan", "Wietnam", "Laos",
            "Kambodża", "Tajlandia", "Mjanma", "Malezja", "Singapur", "Indonezja",
            "Brunei", "Filipiny", "Timor Wschodni", "Hongkong", "Makau"
        ];

        const AFRICA = [
            "Egipt", "Libia", "Tunezja", "Algieria", "Maroko", "Mauretania",
            "Mali", "Niger", "Czad", "Sudan", "Sudan Południowy", "Erytrea",
            "Dżibuti", "Etiopia", "Somalia", "Kenia", "Uganda", "Tanzania",
            "Rwanda", "Burundi", "Demokratyczna Republika Konga",
            "Republika Konga", "Gabon", "Gwinea Równikowa", "Kamerun",
            "Republika Środkowoafrykańska", "Nigeria", "Benin", "Togo", "Ghana",
            "Wybrzeże Kości Słoniowej", "Liberia", "Sierra Leone", "Gwinea",
            "Gwinea Bissau", "Senegal", "Gambia", "Republika Zielonego Przylądka",
            "Zambia", "Zimbabwe", "Malawi", "Mozambik", "Madagaskar", "Mauritius",
            "Seszele", "Komory", "Angola", "Namibia", "Botswana", "Eswatini",
            "Lesotho", "Republika Południowej Afryki",
            "Święta Helena, Wniebowstąpienia i Tristan da Cunha", "Majotta",
            "Reunion", "Sahara Zachodnia", "Somaliland"
        ];

        const NORTH_AMERICA = [
            "Stany Zjednoczone", "Kanada", "Meksyk", "Gwatemala", "Belize",
            "Honduras", "Salwador", "Nikaragua", "Kostaryka", "Panama", "Kuba",
            "Jamajka", "Haiti", "Dominikana", "Bahamy", "Barbados",
            "Trynidad i Tobago", "Grenada", "Saint Lucia",
            "Saint Vincent i Grenadyny", "Antigua i Barbuda", "Dominika",
            "Saint Kitts i Nevis", "Grenlandia", "Portoryko", "Bermudy",
            "Kajmany", "Brytyjskie Wyspy Dziewicze", "Amerykańskie Wyspy Dziewicze",
            "Turks i Caicos", "Anguilla", "Montserrat", "Aruba", "Curaçao",
            "Sint Maarten", "Saint-Pierre i Miquelon", "Saint-Barthélemy",
            "Saint-Martin"
        ];

        const SOUTH_AMERICA = [
            "Brazylia", "Argentyna", "Chile", "Peru", "Kolumbia", "Wenezuela",
            "Ekwador", "Boliwia", "Paragwaj", "Urugwaj", "Gujana", "Surinam",
            "Falklandy", "Gujana Francuska"
        ];

        const OCEANIA = [
            "Australia", "Nowa Zelandia", "Papua-Nowa Gwinea", "Fidżi",
            "Vanuatu", "Wyspy Salomona", "Samoa", "Tonga", "Kiribati", "Tuvalu",
            "Nauru", "Palau", "Mikronezja", "Wyspy Marshalla", "Nowa Kaledonia",
            "Polinezja Francuska", "Guam", "Samoa Amerykańskie",
            "Wyspy Mariany Północne", "Wyspa Bożego Narodzenia",
            "Wyspy Kokosowe", "Norfolk", "Tokelau", "Niue", "Wyspy Cooka",
            "Wallis i Futuna"
        ];

        const CONTINENTS = [
            { label: "Europa", list: EUROPE },
            { label: "Azja", list: ASIA },
            { label: "Afryka", list: AFRICA },
            { label: "Ameryka Północna", list: NORTH_AMERICA },
            { label: "Ameryka Południowa", list: SOUTH_AMERICA },
            { label: "Oceania", list: OCEANIA }
        ];

        const allCountries = EUROPE.concat(ASIA, AFRICA, NORTH_AMERICA, SOUTH_AMERICA, OCEANIA);

        // ============================================================
        // STAN GRY
        // ============================================================
        let mode = 'medium';
        let phase = 1;             // 1 = wybory wstępne, 2 = pojedynki finałowe
        let phase1Queue = [];      // grupy rundy 1: [{ continent: string|null, pairs: [[a,b], ...] }]
        let groupIndex = 0;
        let pairIndexInGroup = 0;
        let selectedPhase1 = [];   // wszystkie wybory z rundy 1 (bez powtórek)
        let phase2Pairs = [];      // pary rundy 2, zbudowane z selectedPhase1
        let phase2Index = 0;
        let phase2Winners = [];    // zwycięzcy rundy 2

        const screenStart = document.getElementById('screen-start');
        const screenMode = document.getElementById('screen-mode');
        const screenInterstitial = document.getElementById('screen-interstitial');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');

        const interstitialLabel = document.getElementById('interstitial-label');
        const interstitialTitle = document.getElementById('interstitial-title');
        const interstitialDesc = document.getElementById('interstitial-desc');
        let pendingAction = null; // funkcja wywoływana po kliknięciu "Dalej"

        const btn1 = document.getElementById('btn-1');
        const btn2 = document.getElementById('btn-2');
        const span1 = btn1.querySelector('span');
        const span2 = btn2.querySelector('span');
        const roundCounter = document.getElementById('round-counter');
        const resultPlace1 = document.getElementById('result-place-1');
        const resultPlace2 = document.getElementById('result-place-2');
        const resultPlace3 = document.getElementById('result-place-3');

        function showScreen(screen) {
            [screenStart, screenMode, screenInterstitial, screenGame, screenResult].forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function showInterstitial(label, title, desc, nextFn) {
            interstitialLabel.innerText = label;
            interstitialTitle.innerText = title;
            interstitialDesc.innerText = desc;
            pendingAction = nextFn;
            showScreen(screenInterstitial);
        }

        function continueFromInterstitial() {
            if (pendingAction) pendingAction();
        }

        function getRandomCountry() {
            return allCountries[Math.floor(Math.random() * allCountries.length)];
        }

        function getRandomDistinctFrom(exclude) {
            let country = getRandomCountry();
            while (exclude.includes(country)) {
                country = getRandomCountry();
            }
            return country;
        }

        // Tasowanie tablicy (Fisher-Yates)
        function shuffle(array) {
            const copy = array.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // Z tablicy państw robi listę par bez powtórek (nieparzysta reszta odpada)
        function toPairs(list) {
            const shuffled = shuffle(list);
            const pairs = [];
            for (let i = 0; i + 1 < shuffled.length; i += 2) {
                pairs.push([shuffled[i], shuffled[i + 1]]);
            }
            return pairs;
        }

        // Buduje kolejkę rundy 1 w zależności od wybranego trybu
        function buildPhase1Queue(selectedMode) {
            if (selectedMode === 'ultimate') {
                return CONTINENTS.map(c => ({ continent: c.label, pairs: toPairs(c.list) }));
            }
            const total = MODE_ROUNDS[selectedMode];
            const shuffled = shuffle(allCountries).slice(0, total * 2);
            const pairs = [];
            for (let i = 0; i < shuffled.length; i += 2) {
                pairs.push([shuffled[i], shuffled[i + 1]]);
            }
            return [{ continent: null, pairs }];
        }

        function selectMode(chosenMode) {
            mode = chosenMode;
            phase = 1;
            phase1Queue = buildPhase1Queue(mode);
            groupIndex = 0;
            pairIndexInGroup = 0;
            selectedPhase1 = [];
            phase2Pairs = [];
            phase2Index = 0;
            phase2Winners = [];

            const firstGroup = phase1Queue[0];
            if (firstGroup.continent) {
                showInterstitial(
                    'FAZA 1 Z 2',
                    firstGroup.continent.toUpperCase(),
                    'Wybieraj spośród państw i terytoriów kontynentu ' + firstGroup.continent + '.',
                    () => { showScreen(screenGame); drawCurrentPair(); }
                );
            } else {
                showInterstitial(
                    'FAZA 1 Z 2',
                    'RUNDA 1',
                    firstGroup.pairs.length + ' pojedynczych wyborów. Za każdym razem kliknij państwo, które bardziej Ci się podoba.',
                    () => { showScreen(screenGame); drawCurrentPair(); }
                );
            }
        }

        function backToModeSelect() {
            showScreen(screenMode);
        }

        function updateRoundCounter(label, current, total) {
            roundCounter.innerText = label + ' \u00b7 ' + current + ' / ' + total;
        }

        function drawCurrentPair() {
            const group = phase1Queue[groupIndex];
            const pair = group.pairs[pairIndexInGroup];
            span1.innerText = pair[0];
            span2.innerText = pair[1];
            const label = group.continent ? group.continent.toUpperCase() : 'RUNDA 1';
            updateRoundCounter(label, pairIndexInGroup + 1, group.pairs.length);
        }

        function drawPhase2Round() {
            const pair = phase2Pairs[phase2Index];
            span1.innerText = pair[0];
            span2.innerText = pair[1];
            updateRoundCounter('RUNDA 2', phase2Index + 1, phase2Pairs.length);
        }

        function buildPhase2Pairs() {
            phase2Pairs = toPairs(selectedPhase1);
        }

        function goToPhase2() {
            buildPhase2Pairs();
            phase = 2;
            phase2Index = 0;
            showInterstitial(
                'FAZA 2 Z 2',
                'RUNDA 2',
                'Twoje wybrane ' + selectedPhase1.length + ' państw zmierzą się teraz ze sobą w ' + phase2Pairs.length + ' pojedynkach.',
                () => { showScreen(screenGame); drawPhase2Round(); }
            );
        }

        function choose(which) {
            const chosenCountry = which === 1 ? span1.innerText : span2.innerText;

            if (phase === 1) {
                selectedPhase1.push(chosenCountry);
                const group = phase1Queue[groupIndex];
                pairIndexInGroup++;

                if (pairIndexInGroup >= group.pairs.length) {
                    groupIndex++;
                    pairIndexInGroup = 0;

                    if (groupIndex >= phase1Queue.length) {
                        goToPhase2();
                    } else {
                        const nextGroup = phase1Queue[groupIndex];
                        showInterstitial(
                            'FAZA 1 Z 2',
                            nextGroup.continent.toUpperCase(),
                            'Wybieraj spośród państw i terytoriów kontynentu ' + nextGroup.continent + '.',
                            () => { showScreen(screenGame); drawCurrentPair(); }
                        );
                    }
                } else {
                    drawCurrentPair();
                }
            } else {
                phase2Winners.push(chosenCountry);
                phase2Index++;
                if (phase2Index >= phase2Pairs.length) {
                    showResult();
                } else {
                    drawPhase2Round();
                }
            }
        }

        function showResult() {
            // 1 miejsce: losowe państwo spośród zwycięzców rundy 2.
            const place1 = phase2Winners[Math.floor(Math.random() * phase2Winners.length)];
            // 2 i 3 miejsce: całkowicie losowe państwa z całej bazy, niezależne od gry.
            const place2 = getRandomDistinctFrom([place1]);
            const place3 = getRandomDistinctFrom([place1, place2]);

            resultPlace1.innerText = place1;
            resultPlace2.innerText = place2;
            resultPlace3.innerText = place3;

            showScreen(screenResult);
        }
    </script>
</body>
